name: Windows build

# Builds the Windows installer (x64 and ARM64) and runs the unit tests on a real Windows machine.
# Download the installer from the run's "Artifacts" section.

on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

jobs:
  build:
    name: Installer (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build the installer
        run: npm run ${{ matrix.arch == 'arm64' && 'dist:arm64' || 'dist' }}

      - name: Show what was built
        shell: bash
        run: ls -la dist/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: android-mirroring-windows-${{ matrix.arch }}
          path: windows/dist/*.exe
          if-no-files-found: error
